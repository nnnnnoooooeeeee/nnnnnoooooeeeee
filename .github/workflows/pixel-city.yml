name: Pixel City

on:
  schedule:
    - cron: "17 17 * * *"   # every day at 00:17 WIB (17:17 UTC)
  workflow_dispatch:         # run manually from the Actions tab
  push:
    branches: [main]
    paths:
      - scripts/pixel_city.py
      - .github/workflows/pixel-city.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate city
        env:
          # Optional: add a PAT as the GH_PAT secret to include private contributions
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python scripts/pixel_city.py --user ${{ github.repository_owner }} --out dist

      - name: Publish to the output branch
        run: |
          cd dist
          git init -q -b output
          git add .
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update pixel city"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
